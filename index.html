<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>单词小课堂 · spider / robot</title>
<link rel="stylesheet" href="libs/element-ui.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#e9f5ff 0%,#eaf7ee 100%);
    color:#23303f;-webkit-tap-highlight-color:transparent;
  }
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 14px 90px}
  .wrap{width:100%;max-width:460px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .topbar .stars .el-tag{font-size:14px;font-weight:700;padding:0 14px;height:32px;line-height:32px}
  .switchbtn{font-weight:700}

  .hero{border-radius:22px!important;box-shadow:0 14px 34px rgba(70,120,180,.16)!important;border:none!important}
  .hero .el-card__body{padding:22px 18px 18px;text-align:center}
  .emoji{font-size:96px;line-height:1;filter:drop-shadow(0 10px 16px rgba(60,110,160,.22));
    animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .word{font-size:40px;font-weight:900;letter-spacing:2px;margin:10px 0 2px;color:#2d3f63}
  .ph{font-size:14px;color:#7b8ea8;margin-bottom:2px}
  .zh{display:inline-block;margin-top:8px;font-size:15px;font-weight:700;color:#3f7ad6;
    background:#eaf3ff;border-radius:999px;padding:4px 14px}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .actions .el-button{font-weight:700;border-radius:14px;padding:12px 18px;font-size:15px;margin:0}
  .btn-say{background:linear-gradient(135deg,#8fc2ff,#5a95f0)!important;border:none!important;color:#fff!important}
  .btn-spell{background:linear-gradient(135deg,#b39dff,#7b5cf0)!important;border:none!important;color:#fff!important}
  .btn-find{background:linear-gradient(135deg,#ffc46b,#ff9b3d)!important;border:none!important;color:#5a3200!important}

  .tipbox{margin-top:14px;font-size:12.5px;color:#7b8ea8;line-height:1.6;text-align:center}

  /* 拼词 */
  .slots{display:flex;gap:8px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap}
  .slot{width:46px;height:54px;border-radius:12px;background:#f4f8ff;border:2px dashed #b9cde4;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#4a3a86;transition:.15s}
  .slot.filled{border-style:solid;border-color:#7b5cf0;background:#efeaff}
  .tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tile{width:52px;height:52px;border-radius:12px;background:#ffd75e;border:none;cursor:pointer;
    font-size:24px;font-weight:900;color:#5a4500;box-shadow:0 4px 0 #dbb02a;transition:transform .1s}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 #dbb02a}
  .tile.used{visibility:hidden}
  .tile.hint{animation:tpulse .7s ease-in-out 3;box-shadow:0 0 0 4px rgba(123,92,240,.5),0 4px 0 #dbb02a}
  .tile.shake{animation:shake .4s}
  @keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

  /* 找不同 */
  .buggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px auto 4px;max-width:300px}
  .cell{aspect-ratio:1;border-radius:16px;border:2px solid #e2ecf7;background:#f8fbff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .1s}
  .cell:active{transform:scale(.94)}
  .cell.found{border-color:#43c08a;background:#e8f9f0;animation:pop .4s}
  .cell.hintcell{animation:cpulse .7s ease-in-out 3;box-shadow:0 0 0 4px rgba(67,192,138,.45)}
  .cell.shake{animation:shake .4s}
  @keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes cpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  /* 机器人 */
  .robot{position:fixed;left:8px;bottom:14px;z-index:2200;display:flex;align-items:flex-end;gap:8px}
  .robot-bubble{max-width:56vw;background:#fff;border:1px solid #e2ecf7;color:#33465c;font-size:12.5px;
    line-height:1.5;font-weight:700;padding:9px 12px;border-radius:14px;box-shadow:0 8px 22px rgba(40,80,140,.18);
    opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
  .robot-bubble.show{opacity:1;transform:none}
  .robot-body{width:58px;height:72px;cursor:pointer;filter:drop-shadow(0 8px 12px rgba(40,80,140,.22));
    animation:rfloat 3.4s ease-in-out infinite}
  @keyframes rfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .robot-body .eye{transform-box:fill-box;transform-origin:center;animation:rblink 4.2s infinite}
  @keyframes rblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
  .robot-body .arm{transform-box:view-box;transform-origin:50px 54px;animation:rwave 3.2s ease-in-out infinite}
  @keyframes rwave{0%,68%,100%{transform:rotate(0)}78%{transform:rotate(-24deg)}88%{transform:rotate(-8deg)}}

  .el-dialog__title{font-weight:800}
  .el-dialog{border-radius:18px;overflow:hidden}
  @media (max-width:420px){
    .el-dialog{width:90%!important}
    .word{font-size:34px}
    .emoji{font-size:80px}
  }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div class="topbar">
      <span class="stars"><el-tag type="warning" effect="light">⭐ {{ stars }}</el-tag></span>
      <el-button class="switchbtn" type="primary" plain round @click="toggleWord">
        🔄 切换到 {{ other.emoji }} {{ other.word }}
      </el-button>
    </div>

    <el-card class="hero" shadow="always">
      <div class="emoji">{{ cur.emoji }}</div>
      <div class="word">{{ cur.word }}</div>
      <div class="ph">{{ cur.ph }}</div>
      <span class="zh">{{ cur.zh }}</span>

      <div class="actions">
        <el-button class="btn-say" icon="el-icon-video-play" @click="say">听一听</el-button>
        <el-button class="btn-spell" icon="el-icon-edit-outline" @click="openSpell">拼一拼</el-button>
        <el-button class="btn-find" icon="el-icon-search" @click="openFind">找不同</el-button>
      </div>
      <div class="tipbox">
        点「听一听」听真人发音 · 现在学的是 <b>{{ cur.word }}</b>（{{ cur.zh }}）<br>
        卡住了就点左下角小机器人 🤖
      </div>
    </el-card>
  </div>

  <!-- 拼词 -->
  <el-dialog :visible.sync="spellVisible" width="86%" :show-close="false" :close-on-click-modal="false" append-to-body>
    <div slot="title">按顺序拼出 <b style="color:#7b5cf0">{{ cur.word }}</b></div>
    <div class="slots">
      <div v-for="(s,i) in target" :key="'s'+i" class="slot" :class="{filled: s.filled}">{{ s.ch }}</div>
    </div>
    <div class="tiles">
      <button v-for="(t,i) in tiles" :key="'t'+i" class="tile" :class="{used:t.used, hint:t.hint, shake:t.shake}"
              @click="pickTile(i)">{{ t.ch }}</button>
    </div>
    <div style="text-align:center;margin-top:16px">
      <el-button round @click="resetSpell">重新来</el-button>
      <el-button round type="primary" @click="spellVisible=false">回到单词</el-button>
    </div>
  </el-dialog>

  <!-- 找不同 -->
  <el-dialog :visible.sync="findVisible" width="86%" :show-close="false" :close-on-click-modal="false" append-to-body>
    <div slot="title">找出不一样的那一个</div>
    <div class="buggrid">
      <div v-for="(c,i) in findGrid" :key="'c'+i" class="cell"
           :class="{found:c.found, hintcell:c.hint, shake:c.shake}" @click="pickFind(i)">{{ c.emoji }}</div>
    </div>
    <div style="text-align:center;color:#7b8ea8;font-size:13px;margin-top:10px">{{ findMsg }}</div>
    <div style="text-align:center;margin-top:14px">
      <el-button round type="primary" @click="findVisible=false">回到单词</el-button>
    </div>
  </el-dialog>

  <!-- 机器人 -->
  <div class="robot">
    <div class="robot-bubble" :class="{show:robotShow}">{{ robotTip }}</div>
    <div class="robot-body" @click="robotTap" aria-label="点我提示">
      <svg viewBox="0 0 72 88" width="100%" height="100%">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff0ff"/><stop offset="1" stop-color="#9cc6f2"/></linearGradient>
          <linearGradient id="rg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d3ff"/><stop offset="1" stop-color="#6aa6ff"/></linearGradient>
        </defs>
        <line x1="36" y1="12" x2="36" y2="3" stroke="#5d7fa8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="36" cy="3" r="3.4" fill="#ff8fb1"/>
        <rect x="12" y="12" width="48" height="36" rx="13" fill="url(#rg)" stroke="#7fa6ce" stroke-width="2"/>
        <g class="eye">
          <circle cx="27" cy="29" r="6.5" fill="#fff" stroke="#7fa6ce" stroke-width="1.2"/>
          <circle cx="45" cy="29" r="6.5" fill="#fff" stroke="#7fa6ce" stroke-width="1.2"/>
          <circle cx="27" cy="30" r="3" fill="#22304a"/><circle cx="45" cy="30" r="3" fill="#22304a"/>
        </g>
        <path d="M28 41 Q36 47 44 41" stroke="#3a5578" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <rect x="19" y="50" width="34" height="26" rx="10" fill="url(#rg2)" stroke="#5d8fc9" stroke-width="2"/>
        <circle cx="36" cy="60" r="4.2" fill="#eafaff"/>
        <rect x="27" y="67" width="18" height="3.4" rx="1.7" fill="#eafaff" opacity=".85"/>
        <rect x="11" y="53" width="7" height="17" rx="3.5" fill="#8fbdf0" stroke="#5d8fc9" stroke-width="1.6"/>
        <g class="arm">
          <rect x="54" y="52" width="7" height="18" rx="3.5" fill="#8fbdf0" stroke="#5d8fc9" stroke-width="1.6"/>
          <circle cx="57.5" cy="52" r="4.2" fill="#dff0ff" stroke="#5d8fc9" stroke-width="1.6"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<script src="libs/vue.min.js"></script>
<script src="libs/element-ui.js"></script>

];

new Vue({
  el:'#app',
  data:{
    words: WORDS,
    wi: 0,
    stars: 0,
    spellVisible: false,
    findVisible: false,
    slots: [],
    tiles: [],
    index: 0,
    spellWrong: 0,
    findGrid: [],
    findOdd: -1,
    findWrong: 0,
    findMsg: '',
    robotTip: '',
    robotShow: false,
    robotTimer: null,
    audio: null
  },
  computed:{
    cur(){ return this.words[this.wi]; },
    other(){ return this.words[1 - this.wi]; },
    target(){ return this.cur.word.split('').map((ch,i)=>({ch, filled: i < this.index})); }
  },
  mounted(){
    this.robotSay('嗨！我是小机器人，点我可以要提示 🤖', 4200);
  },
  methods:{
    /* ---------- 单词切换 ---------- */
    toggleWord(){
      this.wi = 1 - this.wi;
      this.resetSpell();
      this.say();
      this.robotSay('现在学 ' + this.cur.word + '（' + this.cur.zh + '）', 3000);
    },
    /* ---------- 发音 ---------- */
    say(){
      try{
        if(this.audio){ try{ this.audio.pause(); }catch(e){} }
        this.audio = new Audio(this.cur.audio);
        this.audio.volume = 1;
        const p = this.audio.play();
        if(p && p.catch) p.catch(()=>{});
      }catch(e){}
    },
    /* ---------- 机器人 ---------- */
    robotSay(t, ms){
      this.robotTip = t; this.robotShow = true;
      clearTimeout(this.robotTimer);
      this.robotTimer = setTimeout(()=>{ this.robotShow = false; }, ms || 3000);
    },
    robotTap(){
      if(this.findVisible) return this.findHint();
      if(this.spellVisible) return this.spellHint();
      this.robotSay('点「听一听」听 ' + this.cur.word + ' 的发音，或者点「拼一拼」练拼写');
    },
    /* ---------- 拼词 ---------- */
    resetSpell(){
      this.index = 0; this.spellWrong = 0;
      const letters = this.cur.word.split('');
      const pool = letters.concat(['a','o','m']).map(ch=>({ch, used:false, hint:false, shake:false}));
      for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
      this.tiles = pool;
    },
    openSpell(){
      this.resetSpell();
      this.spellVisible = true;
      this.say();
      this.robotSay('按 ' + this.cur.word.split('').join('-') + ' 的顺序点字母');
    },
    pickTile(i){
      const t = this.tiles[i];
      if(!t || t.used) return;
      const need = this.cur.word[this.index];
      if(t.ch === need){
        t.used = true;
        this.index++;
        if(this.index === this.cur.word.length){
          this.stars += 3;
          this.robotSay('拼对啦！你拼出了 ' + this.cur.word + ' 🎉', 3200);
          this.$message({ message:'太棒了！' + this.cur.word + ' 🎉', type:'success', duration:1200 });
          this.say();
          setTimeout(()=>{ if(this.spellVisible) this.resetSpell(); }, 1600);
        }
      }else{
        t.shake = true; setTimeout(()=>{ t.shake = false; }, 420);
        this.spellWrong++;
        if(this.spellWrong >= 2){ this.spellWrong = 0; setTimeout(()=>this.spellHint(), 420); }
      }
    },
    spellHint(){
      if(!this.spellVisible) return;
      const need = this.cur.word[this.index];
      if(!need){ this.robotSay('已经拼完啦，点「重新来」再练一次'); return; }
      this.robotSay('小提示：下一位是「' + need + '」');
      const t = this.tiles.find(x => x.ch === need && !x.used);
      if(t){ t.hint = true; setTimeout(()=>{ t.hint = false; }, 2400); }
    },
    /* ---------- 找不同 ---------- */
    openFind(){
      this.buildFind();
      this.findVisible = true;
      this.robotSay('九个小图标里，有一个和大家不一样，找出来！');
    },
    buildFind(){
      this.findWrong = 0; this.findMsg = '';
      const n = 9, odd = Math.floor(Math.random()*n);
      this.findOdd = odd;
      this.findGrid = Array.from({length:n}, (_,i)=>({
        emoji: i===odd ? this.cur.odd : this.cur.emoji,
        found:false, hint:false, shake:false
      }));
    },
    pickFind(i){
      const c = this.findGrid[i];
      if(!c || c.found) return;
      if(i === this.findOdd){
        c.found = true;
        this.stars += 2;
        this.findMsg = '✅ 正确！再来一局…';
        this.robotSay('找到啦！眼力真好 🎯', 2600);
        this.say();
        setTimeout(()=>{ if(this.findVisible) this.buildFind(); }, 1300);
      }else{
        c.shake = true; setTimeout(()=>{ c.shake = false; }, 420);
        this.findMsg = '再看看～';
        this.findWrong++;
        if(this.findWrong >= 2){ this.findWrong = 0; setTimeout(()=>this.findHint(), 420); }
      }
    },
    findHint(){
      if(!this.findVisible) return;
      const c = this.findGrid[this.findOdd];
      if(c){ c.hint = true; setTimeout(()=>{ c.hint = false; }, 2400); }
      this.robotSay('看仔细，有一个和大家不一样哦');
    }
  }
});
</script>
